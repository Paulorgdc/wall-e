<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal de Acesso Docente - Plataforma WALL-E">
  <title>Login - Professor</title>
  <link rel="stylesheet" href="../../assets/css/teacher-login.css"> 
</head>
<body>
  <main class="login-container">
    <div class="login-box">
      <img src="../../assets/images/logo.png" alt="Logo da Universidade" class="logo">
      <h1>Portal do Professor</h1>
      
      <form id="loginForm">
        <div class="input-group">
          <label for="cpf">CPF</label>
          <input type="number" id="cpf" name="cpf" placeholder="Digite seu CPF" required>
          <small id="cpf-mensagem"></small>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="login-button">Entrar no Sistema</button>
      </form>
    </div>
  </main>

  <script src="../../assets/js/validate-cpf.js"></script>
  <script src="../../assets/js/teacher-login.js"></script>
</body>
</html>
