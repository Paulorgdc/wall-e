<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WALL-E - Início</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="main-portal">
    <div class="header-content" style="text-align: center; margin-top: 50px;">
      <img class="logo" src="../assets/images/logo.png" alt="WALL-E Logo" width="400">
      <h1>Plataforma de Aprendizagem Adaptativa</h1>
    </div>

    <div class="login-container">
      <div class="login-box" style="text-align: center;">
        <h2>Seja bem-vindo!</h2>
        <p>Selecione o seu perfil de acesso:</p>
        <div class="button-group" style="display: flex; flex-direction: column; gap: 15px; align-items: center;">
          <a href="/student/login" class="login-button">Acessar como Aluno</a>
          <a href="/teacher/login" class="login-button">Acessar como Professor</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
