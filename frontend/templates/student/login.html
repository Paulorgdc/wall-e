<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Aluno</title>
  <link rel="stylesheet" href="../../assets/css/student-login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <img src="../../assets/images/logo.png" alt="Logo da Universidade" class="logo">
      <h1>Portal do Aluno</h1>
      <form id="loginForm">
        <div class="input-group">
          <label for="matricula">Matrícula</label>
          <input type="number" id="matricula" placeholder="Digite seu RA" required>
        </div>
        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>
        <button type="submit" class="login-button">Entrar no Sistema</button>
      </form>
    </div>
  </div>
  <script src="../../assets/js/student-login.js"></script>
</body>
</html>
